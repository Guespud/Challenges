name: CI — auth

on:
  push:
    branches: [main]
    paths:
      - 'services/auth/**'
      - 'packages/shared/**'
      - 'docs/openapi/auth.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-auth.yml'
  pull_request:
    paths:
      - 'services/auth/**'
      - 'packages/shared/**'
      - 'docs/openapi/auth.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-auth.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitalis
          POSTGRES_PASSWORD: vitalis
          POSTGRES_DB: vitalis_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vitalis:vitalis@localhost:5432/vitalis_auth_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generar cliente de Prisma
        working-directory: services/auth
        run: npx prisma generate

      - name: Migrar base de test
        working-directory: services/auth
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/auth
        run: npm run typecheck

      - name: Tests (unitarios + contrato OpenAPI)
        working-directory: services/auth
        run: NODE_ENV=test npx vitest run

      - name: Build
        working-directory: services/auth
        run: npm run build

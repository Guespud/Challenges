global:
  scrape_interval: 10s

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: ['auth:3001']
  - job_name: appointments
    static_configs:
      - targets: ['appointments:3002']
  - job_name: payments
    static_configs:
      - targets: ['payments:3003']
  - job_name: gateway
    static_configs:
      - targets: ['gateway:3000']

openapi: 3.1.0
info:
  title: Vitalis Clinic — Auth Service
  version: 1.0.0
  description: >
    Registro, login y refresh de tokens. Dueño exclusivo de la tabla `User`.
    Publica el evento `UserRegistered` (Redis Streams) cuando alguien se
    registra — ver RFC-001-bounded-contexts.md.
servers:
  - url: http://localhost:4000
    description: Gateway local (Docker Compose)
  - url: http://localhost:3001
    description: Servicio directo, local (fuera del gateway)

tags:
  - name: auth
  - name: me

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error, statusCode]
      properties:
        error:
          type: string
          example: Credenciales inválidas
        statusCode:
          type: integer
          example: 401
    Role:
      type: string
      enum: [patient, doctor, staff]
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: >
            Mínimo 8 caracteres, al menos una mayúscula, una minúscula, un
            número y un carácter especial.
          minLength: 8
        name:
          type: string
          minLength: 1
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
  responses:
    BadRequest:
      description: Body/query inválido según el schema de Zod.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Credenciales inválidas o token inválido/expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: La operación no se puede procesar (ej. email ya registrado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registrar un nuevo usuario
      description: >
        Crea el usuario y publica `UserRegistered` en Redis Streams para que
        otros servicios (ej. Appointments) actualicen su proyección local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Par de tokens JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar el access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nuevo access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [me]
      summary: Perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
